name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game: [cards, conways-game-of-life, rock-paper-scissors, tic-tac-toe]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install
        working-directory: ${{ matrix.game }}
      - run: npm test
        working-directory: ${{ matrix.game }}
